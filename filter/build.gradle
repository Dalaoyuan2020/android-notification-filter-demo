plugins { id 'com.android.application' }
android {
    namespace 'com.example.notificationdemo.filter'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.notificationdemo.filter'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.example.notificationdemo.filter.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
